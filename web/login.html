<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packhound login</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body class="loginpage">
<form class="login" id="login">
  <div class="brand"><img src="icon.svg" alt="" width="28" height="28">Packhound</div>
  <label><span>User name</span><input type="text" id="user" autocomplete="username" autofocus required></label>
  <label><span>Password</span><input type="password" id="password" autocomplete="current-password" required></label>
  <button class="primary" type="submit">Log in</button>
  <div class="hint warn" id="err" hidden></div>
</form>
<script src="login.js"></script>
</body>
</html>
