name: Release

# Builds every platform from the tagged commit and publishes them, so the
# binaries people download are demonstrably built from the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the changelog has an entry for this version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if ! grep -qF "What's new in ${VERSION} (" README.md; then
            echo "::error::README.md has no changelog entry for ${VERSION}."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"
          build() { # os arch ext
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$LDFLAGS" -o "dist/packhound-$1-$2$3" .
          }
          build windows amd64 .exe
          build windows arm64 .exe
          build darwin  amd64 ""
          build darwin  arm64 ""
          build linux   amd64 ""
          build linux   arm64 ""

      - name: Make the macOS universal binary
        run: python3 scripts/make-universal.py
          dist/packhound-darwin-amd64
          dist/packhound-darwin-arm64
          dist/packhound-macos-universal

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          chmod +x packhound-macos-universal packhound-linux-* packhound-darwin-*
          zip -q packhound-macos.zip packhound-macos-universal
          tar czf packhound-linux-amd64.tar.gz packhound-linux-amd64
          tar czf packhound-linux-arm64.tar.gz packhound-linux-arm64
          # Some proxies refuse a bare .exe; the zip carries the same file past them.
          zip -q packhound-windows-amd64.zip packhound-windows-amd64.exe
          zip -q packhound-windows-arm64.zip packhound-windows-arm64.exe
          rm -f packhound-darwin-* packhound-linux-amd64 packhound-linux-arm64
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Packhound ${{ github.event.inputs.tag || github.ref_name }}
          body_path: docs/RELEASE-NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
