name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet on every platform
        run: |
          for os in linux darwin windows; do GOOS=$os go vet ./...; done
      - name: Test
        run: go test ./...
      - name: Build every platform
        env:
          CGO_ENABLED: "0"
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null . || exit 1
          done
