# Points release tags at other commits, keeping their releases: for when
# history has been rewritten. Run it from the Actions tab.
name: Move tags

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated tag=commit pairs (e.g. v1.0.0=5662e9e2...)"
        required: true

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the tags
        env:
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          set -euo pipefail
          for pair in $TAGS; do
            tag="${pair%%=*}"
            commit="${pair#*=}"
            git merge-base --is-ancestor "$commit" HEAD # only commits on the branch
            git tag -f "$tag" "$commit"
            git push -f origin "refs/tags/$tag"
            echo "$tag -> $commit"
          done
